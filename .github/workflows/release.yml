name: Build and publish signed Android release

on:
  push:
    branches:
      - investigation/htc-one-44-runtime-crash
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aemulator-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Build Android 4.4-compatible guest GLES bridge
        run: |
          chmod +x native/glbridge/build32.sh
          ./native/glbridge/build32.sh

      - name: Restore persistent signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::Missing ANDROID_SIGNING_PASSPHRASE repository secret."
            exit 1
          fi
          test -f .github/signing/release.jks.gpg
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --output release.jks \
            --decrypt .github/signing/release.jks.gpg
          {
            echo "storeFile=release.jks"
            echo "storePassword=$SIGNING_PASSPHRASE"
            echo "keyAlias=aemulator"
            echo "keyPassword=$SIGNING_PASSPHRASE"
          } > keystore.properties

      - name: Build signed release APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStandardRelease
          mkdir -p release-output
          cp app/build/outputs/apk/standard/release/*.apk "release-output/AEmulator-Kazutchi-${{ steps.version.outputs.name }}.apk"
          test -s release-output/*.apk

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="$(find release-output -maxdepth 1 -name '*.apk' -print -quit)"
          apksigner verify --verbose "$APK"
          aapt dump badging "$APK" | grep -E "package: name='app.aemu'|versionName='${{ steps.version.outputs.name }}'"

      - name: Publish GitHub Release with release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AEmulator Kazutchi ${{ steps.version.outputs.name }}
          body_path: release-notes/${{ steps.version.outputs.name }}.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-output/*.apk
