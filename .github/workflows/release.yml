name: Build signed Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore persistent signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::Add the ANDROID_SIGNING_PASSPHRASE repository secret first."
            exit 1
          fi
          if [ ! -f .github/signing/release.jks.gpg ]; then
            echo "::error::Signing key is not initialized. Run the 'Initialize Android signing key' workflow first."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --output release.jks \
            --decrypt .github/signing/release.jks.gpg
          {
            echo "storeFile=release.jks"
            echo "storePassword=$SIGNING_PASSPHRASE"
            echo "keyAlias=aemulator"
            echo "keyPassword=$SIGNING_PASSPHRASE"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStandardRelease
          mkdir -p release-output
          cp app/build/outputs/apk/standard/release/*.apk release-output/AEmulator-Kazutchi-0.0.0.9.apk

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AEmulator-Kazutchi-0.0.0.9
          path: release-output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-output/*.apk
