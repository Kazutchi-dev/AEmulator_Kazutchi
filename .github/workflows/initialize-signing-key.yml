name: Initialize Android signing key

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch that should receive the encrypted signing key
        required: true
        default: investigation/htc-one-44-runtime-crash
        type: string

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate and encrypt the signing key once
        env:
          SIGNING_PASSPHRASE: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::Add the ANDROID_SIGNING_PASSPHRASE repository secret before running this workflow."
            exit 1
          fi
          if [ -f .github/signing/release.jks.gpg ]; then
            echo "::error::A signing key already exists. Refusing to replace it because doing so would break app updates."
            exit 1
          fi

          mkdir -p .github/signing
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -storepass "$SIGNING_PASSPHRASE" \
            -keypass "$SIGNING_PASSPHRASE" \
            -alias aemulator \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=AEmulator Kazutchi, OU=Android, O=Kazutchi, C=JP"

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output .github/signing/release.jks.gpg release.jks

          rm -f release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/signing/release.jks.gpg
          git commit -m "Initialize encrypted Android release signing key"
          git push origin "HEAD:$TARGET_BRANCH"
