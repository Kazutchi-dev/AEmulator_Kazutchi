name: Verify Android build

on:
  push:
    branches:
      - investigation/htc-one-44-runtime-crash
    paths-ignore:
      - app/src/main/assets/engines/kk/libGLES_aemu.so
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Build Android 4.4-compatible guest GLES bridge
        run: |
          chmod +x native/glbridge/build32.sh
          ./native/glbridge/build32.sh
          if ! git diff --quiet -- app/src/main/assets/engines/kk/libGLES_aemu.so; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/assets/engines/kk/libGLES_aemu.so
            git commit -m "Build Android 4.4-compatible GLES bridge"
            git push
          fi

      - name: Build standard debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleStandardDebug

      - name: Verify HTC engine assets are packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/standard/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          index="$(unzip -p "$apk" assets/engines.idx)"
          entries=(
            engines/kk/libashmemshim.so
            engines/kk/libGLES.so
            engines/kk/audio.primary.default.so
            engines/kk/aemu-stubs.jar
            engines/common/libaemushim.so
            engines/common/lights.default.so
            engines/common/sensors.default.so
            engines/common/camera.default.so
          )
          for entry in "${entries[@]}"; do
            blob="$(awk -F '\t' -v path="$entry" '$1 == path { print $2; exit }' <<< "$index")"
            if [ -z "$blob" ]; then
              echo "::error::Missing engine index entry: $entry"
              exit 1
            fi
            if ! unzip -Z1 "$apk" | grep -Fxq "assets/blobs/$blob"; then
              echo "::error::Missing engine blob for: $entry ($blob)"
              exit 1
            fi
            echo "OK: $entry"
          done
